# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Gaurav Sett
description: >- # this means to ignore newlines until "baseurl:"
  Gaurav Sett is a PhD student at the RAND School of Public Policy and a
  non-resident fellow at IFP, working on artificial intelligence and American
  national security.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://gauravsett.com" # the base hostname & protocol for your site, e.g. http://example.com
github_username: gauravsett
twitter_username: gauravsett
author: Gaurav Sett
lang: en

# Default social preview card, overridable per page with `image:`/`image_width:`/`image_height:`.
# Keep the dimensions in sync with the file — platforms use them to lay the card out
# before the image finishes loading.
image: /assets/og-image.jpg
image_width: 942
image_height: 495

# schema.org/Person structured data, rendered as JSON-LD on the homepage only.
# Edit affiliations here rather than in the layout.
person:
  job_title:
    - Researcher
  locality: Washington
  region: DC
  country: US
  affiliations:
    - name: RAND
      url: https://www.rand.org
  alumni_of:
    - name: Georgia Institute of Technology
      url: https://www.gatech.edu
  knows_about:
    - Artificial intelligence
    - National security
  same_as:
    - https://twitter.com/gauravsett
    - https://linkedin.com/in/gauravsett
    - https://www.rand.org/about/people/s/sett_gaurav.html

# Build settings

exclude:
  - CLAUDE.md
